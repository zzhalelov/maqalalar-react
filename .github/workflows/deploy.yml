name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/maqalalar-react:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/maqalalar-react
            cd /var/www/maqalalar-react
            
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/maqalalar-react:latest
            
            docker stop maqalalar-app || true
            docker rm maqalalar-app || true
            
            docker run -d \
              --name maqalalar-app \
              --restart always \
              -p 127.0.0.1:8086:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/maqalalar-react:latest
            
            docker image prune -f